<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kurkenemmer</title>
<link rel="icon" href="./SPW_DeBoomIn_Huisstijl/logos/Stempels3cm.jpg.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Junegull';
  src: url('./SPW_DeBoomIn_Huisstijl/fonts/junegull/Junegull-ExtraBold.otf') format('opentype');
  font-weight: 800;
  font-style: normal;
}
@font-face {
  font-family: 'AustinText';
  src: url('./SPW_DeBoomIn_Huisstijl/fonts/austin/AustinText-RomanNo2-Trial-BF662b0bb30cd34.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}

:root {
  --brand-dark-green: #195b2e;
  --brand-light-green: #8dc966;
  --brand-yellow: #edc158;
  --brand-red: #f05555;
  
  --bg: #f4f6f4;
  --surface: rgba(255, 255, 255, 0.96);
  --raise: #ffffff;
  --line: rgba(25, 91, 46, 0.2);
  
  --text: #195b2e;
  --muted: rgba(25, 91, 46, 0.75);
  --gold: #edc158;
  --gold-ink: #195b2e;
  --red: #f05555;
  --green: #8dc966;
  
  --r: 16px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background: var(--bg) url('./SPW_DeBoomIn_Huisstijl/graphics/achtergrond-04.png') no-repeat center center fixed;
  background-size: cover; 
  color:var(--text);
  font-family: 'AustinText', "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 12px;
  line-height: 1.5;
  font-feature-settings: "tnum" 1, "lnum" 1;
  -webkit-text-size-adjust: 100%;
}
.wrap{max-width:32rem;margin:0 auto;padding:1.25rem 1.1rem 4rem}
h1,h2,h3{margin:0;font-weight:normal;letter-spacing:-0.01em; color:var(--brand-dark-green)}
h1{font-family: 'Junegull', sans-serif; font-size:36px; line-height:1.1; font-weight:800}
h2{font-size:31.5px; line-height:1.2}
h3{font-size:24.8px}
p{margin:.4rem 0}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.muted{color:var(--muted)}
.small{font-size:11px}

/* masthead */
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1.25rem}
.brand{display:flex;align-items:center;gap:.55rem}
.brand-logo{height:40px;width:auto;border-radius:4px;}
.linkbtn{background:none;border:none;color:var(--muted);padding:.4rem .2rem;text-decoration:underline;
  text-underline-offset:3px}
.linkbtn:hover{color:var(--text)}

/* cards */
.card{background:var(--surface);border:2px solid var(--brand-dark-green);border-radius:var(--r);padding:1.25rem;
  box-shadow: 0 4px 12px rgba(25, 91, 46, 0.15)}
.card + .card{margin-top:.75rem}

/* the hero number */
.balance{padding:1.4rem 1.1rem 1.25rem; text-align:center}
.balance .who{color:var(--muted);font-size:14px}
.figure{font-family: 'Junegull', sans-serif; font-size:3.5rem;line-height:1;font-weight:800;letter-spacing:-0.01em;margin:.35rem 0 .1rem; color:var(--brand-dark-green)}
.unit{font-size:13px;color:var(--muted)}
.rolechip{display:inline-block;margin-top:.7rem;font-size:11px;padding:.3rem .6rem;border-radius:999px;
  border:1px solid var(--brand-dark-green);color:var(--brand-dark-green); background:rgba(141,201,102,0.2)}

/* buttons */
.btn{width:100%;border:2px solid var(--brand-dark-green);background:var(--raise);color:var(--text);
  border-radius:12px;padding:.85rem 1rem;text-align:left;display:flex;justify-content:space-between;
  align-items:center;gap:.5rem;font-size:14px}
.btn:hover{border-color:var(--brand-yellow); background:var(--surface)}
.btn + .btn{margin-top:.5rem}
.btn .arrow{color:var(--muted);flex:none;font-size:18px}
.btn.primary{background:var(--brand-yellow);color:var(--gold-ink);border-color:var(--brand-dark-green);justify-content:center;
  font-family: 'Junegull', sans-serif; font-size:18px; padding:.75rem 1rem;}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{background:none; border:none; text-decoration:underline; justify-content:center}
.btn.quiet:hover{background:transparent}
.btn.center{justify-content:center}

/* team bank strip */
.teamrow{display:flex;justify-content:space-between;align-items:center;padding:.8rem 0;
  border-bottom:1px solid var(--line)}
.teamrow:last-child{border-bottom:none}
.teamrow .amt{font-family: 'Junegull', sans-serif; font-size:20px; font-weight:800}
.teamrow.mine .name{color:var(--brand-dark-green); font-weight:bold}

/* forms */
label{display:block;font-size:14px;color:var(--text);margin:1rem 0 .4rem; font-weight:bold}
input[type=text],input[type=number],input[type=tel],select,textarea{
  width:100%;background:var(--raise);border:2px solid var(--line);color:var(--text);
  border-radius:8px;padding:.7rem .8rem;font-size:14px}
textarea{min-height:5.5rem;resize:vertical;font-family:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:none;border-color:var(--brand-yellow)}
.amount-in{font-family:'Junegull', sans-serif; font-size:2.2rem;font-weight:800;letter-spacing:-0.01em;padding:.6rem .8rem; text-align:center}

/* pin */
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1rem}
.pinpad button{padding:1.2rem 0;border-radius:12px;border:2px solid var(--brand-dark-green);background:var(--raise);
  color:var(--brand-dark-green);font-family:'Junegull', sans-serif; font-size:1.8rem;font-weight:800}
.dots{display:flex;gap:.7rem;justify-content:center;margin:1.2rem 0 .2rem}
.dot{width:.9rem;height:.9rem;border-radius:50%;border:2px solid var(--brand-dark-green)}
.dot.on{background:var(--brand-yellow);border-color:var(--brand-yellow)}

/* ledger */
.entry{display:flex;gap:.7rem;padding:.65rem 0;border-bottom:1px solid var(--line);font-size:12px}
.entry:last-child{border-bottom:none}
.entry .tick{width:.4rem;flex:none;border-radius:2px;background:var(--line)}
.entry.up .tick{background:var(--brand-light-green)}
.entry.down .tick{background:var(--brand-red)}
.entry time{display:block;color:var(--muted);font-size:10px}

.err{color:var(--brand-red);font-size:13px;margin-top:.6rem;min-height:1.2em; font-weight:bold}
.ok{color:var(--brand-light-green)}
.stack > * + *{margin-top:.5rem}
.rosterline{display:flex;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid var(--line)}
.rosterline:last-child{border-bottom:none}
.pin{font-weight:bold;letter-spacing:.12em;color:var(--brand-yellow)}
.sect{margin-top:1.5rem}
.sect h2{margin-bottom:.6rem}
hr{border:none;border-top:1px solid var(--line);margin:1.1rem 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
<script>
/* ---------- storage (shared across every device, via Firebase) ---------- */
// 1. Firebase console -> Project settings -> your web app -> "SDK setup and configuration" -> paste the config object below.
// 2. Firestore Database -> Create database -> Rules tab -> paste the rule from README.md -> Publish.
var firebaseConfig = {
  apiKey: "AIzaSyCW0Xjg9rn0JnoH18a1joSDmtIArEyLkwU",
  authDomain: "spw-dbi-treasury.firebaseapp.com",
  projectId: "spw-dbi-treasury",
  storageBucket: "spw-dbi-treasury.firebasestorage.app",
  messagingSenderId: "397289457493",
  appId: "1:397289457493:web:f977c2767a677dd3fc91dc"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
var gameDocRef = db.collection("kurkenemmer").doc("game");

function save(){
  if(!S) return;
  gameDocRef.set(S).catch(function(e){ console.error("Opslaan mislukt:", e); });
}

var S;                   // the whole bank -- undefined until the first reply from Firebase arrives
var dbError = null;      // set if the connection to Firebase fails
var view = null;         // current screen
var me = null;           // who is signed in
var flash = "";
var adminAuthed = false; // resets every page load, on purpose
var pendingAdminPassword = null; // a new password chosen before the game (S) exists yet

/* Default admin password. Stays "placeholder" in the source on purpose — the app itself
   nudges whoever logs in with it to pick a real one, which is then stored in S.adminPassword
   and takes over as the effective password from then on. */
var ADMIN_PASSWORD = "placeholder";

/* Slot order matches the four preset teams: Bikers, Gangsters, Maffia, Cartel. */
var TEAM_COLORS = ["#3A3A3E", "#3E9C5C", "#C0392B", "#8E5CC7"];
var GRENSWACHT_COLOR = "#f05555";
/* Anyone with more than this on their personal account can be picked clean by Grenswacht. */
var CONFISCATE_THRESHOLD = 50;

/* ---------- helpers ---------- */
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function money(n){ return Number(n).toLocaleString(); }
function unit(){ return S && S.unit ? S.unit : "kurken"; }
function effectiveAdminPassword(){ return (S && S.adminPassword) ? S.adminPassword : ADMIN_PASSWORD; }
function teamDot(color){
  return '<span style="display:inline-block;width:.6rem;height:.6rem;border-radius:50%;' +
         'background:' + color + ';margin-right:.4rem;flex:none"></span>';
}

function everyone(){
  var list = [];
  S.bankers.forEach(function(b){ list.push({id:b.id,name:b.name,pin:b.pin,role:"banker"}); });
  if(S.grenswacht) S.grenswacht.members.forEach(function(m){ list.push({id:m.id,name:m.name,pin:m.pin,role:"grenswacht"}); });
  S.teams.forEach(function(t){
    t.members.forEach(function(m){
      list.push({id:m.id,name:m.name,pin:m.pin,role:m.leader?"leader":"member",teamId:t.id});
    });
  });
  return list;
}
function findPerson(id){
  var hit = null;
  S.bankers.forEach(function(b){ if(b.id===id) hit = {kind:"banker",obj:b}; });
  if(S.grenswacht) S.grenswacht.members.forEach(function(m){
    if(m.id===id) hit = {kind:"grenswacht",obj:m,group:S.grenswacht}; });
  S.teams.forEach(function(t){ t.members.forEach(function(m){
    if(m.id===id) hit = {kind:"member",obj:m,team:t}; }); });
  return hit;
}
/* Keeps older saved games (from before Grenswacht existed) working. */
function normalizeState(){
  if(!S) return;
  if(!S.grenswacht) S.grenswacht = {id:uid(), name:"Grenswacht", bank:0, members:[]};
}
/* Moves a person to a different group (Bankier / Grenswacht / a team), keeping their
   id, name, pin and personal balance. The balance always stays attached to the person —
   while they're Bankier or Grenswacht it's just not shown anywhere, and it reappears as
   soon as they land in a team again. Returns null on success, or an error string. */
function movePersonToGroup(personId, destVal){
  var src = findPerson(personId);
  if(!src) return "Persoon niet gevonden.";

  var destKind = destVal === "banker" ? "banker" : destVal === "grenswacht" ? "grenswacht" : "team";
  var destTeam = destKind === "team" ? teamByIdRef(destVal) : null;
  if(destKind === "team" && !destTeam) return "Team niet gevonden.";

  if(src.kind === "banker" && destKind === "banker") return "Zit al bij de bankiers.";
  if(src.kind === "grenswacht" && destKind === "grenswacht") return "Zit al bij de Grenswacht.";
  if(src.kind === "member" && destKind === "team" && src.team.id === destVal) return "Zit al in dat team.";

  var name = src.obj.name, pin = src.obj.pin, balance = src.obj.balance || 0;
  var fromLabel = src.kind === "banker" ? "Bankier" : src.kind === "grenswacht" ? "Grenswacht" : src.team.name;

  if(src.kind === "banker"){
    S.bankers = S.bankers.filter(function(b){ return b.id !== personId; });
  } else if(src.kind === "grenswacht"){
    S.grenswacht.members = S.grenswacht.members.filter(function(m){ return m.id !== personId; });
  } else {
    src.team.members = src.team.members.filter(function(m){ return m.id !== personId; });
  }

  var toLabel;
  if(destKind === "banker"){
    S.bankers.push({id:personId, name:name, pin:pin, balance:balance});
    toLabel = "Bankier";
  } else if(destKind === "grenswacht"){
    S.grenswacht.members.push({id:personId, name:name, pin:pin, balance:balance});
    toLabel = "Grenswacht";
  } else {
    destTeam.members.push({id:personId, name:name, pin:pin, balance:balance, leader:false});
    toLabel = destTeam.name;
  }

  logIt(name + " verhuisde van " + fromLabel + " naar " + toLabel, "");
  return null;
}
function teamOf(id){ var p = findPerson(id); return p && p.team ? p.team : null; }
function logIt(text, dir){
  S.log.unshift({t:Date.now(), text:text, dir:dir||""});
  if(S.log.length > 200) S.log.length = 200;
}
function amountFrom(v){
  var n = Math.floor(Number(v));
  if(!isFinite(n) || n <= 0) return null;
  return n;
}

/* ---------- render router ---------- */
function go(v){ view = v; flash = ""; render(); }

/* Other devices can push a fresh S in at any moment (see the onSnapshot
   listener below). If someone is mid-typing when that happens, save and
   restore their cursor + typed value so they don't lose it. */
function captureFocus(){
  var el = document.activeElement;
  if(el && el.id && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")){
    return {id: el.id, value: el.value, start: el.selectionStart, end: el.selectionEnd};
  }
  return null;
}
function restoreFocus(info){
  if(!info) return;
  var el = document.getElementById(info.id);
  if(!el) return;
  el.value = info.value;
  el.focus();
  try{ el.setSelectionRange(info.start, info.end); }catch(e){}
}

function render(){
  var app = document.getElementById("app");
  var focusInfo = captureFocus();
  var html, wire = null;

  if(dbError){ html = dbErrorScreen(); wire = wireRetry; }
  else if(view && view.name === "admin-login"){ html = adminLoginScreen(); wire = wireAdminLogin; }
  else if(view && view.name === "admin-set-password"){ html = adminSetPasswordScreen(); wire = wireAdminSetPassword; }
  else if(view && view.name === "admin-panel"){ html = adminPanelScreen(); wire = wireAdminPanel; }
  else if(S === undefined){ html = loadingScreen(); }
  else if(!S){
    if(adminAuthed){ html = setupScreen(); wire = wireSetup; }
    else { html = waitingScreen(); wire = wireWaiting; }
  }
  else if(view && view.name === "pin"){ html = pinScreen(); wire = wirePin; }
  else if(!me){ html = signInScreen(); wire = wireSignIn; }
  else if(view && view.name === "ledger"){ html = ledgerScreen(); wire = wireBack; }
  else if(view && view.name === "roster"){ html = rosterScreen(); wire = wireBack; }
  else if(view && view.name === "move"){ html = moveScreen(); wire = wireMove; }
  else if(view && view.name === "confiscate"){ html = confiscateScreen(); wire = wireConfiscate; }
  else { html = homeScreen(); wire = wireHome; }

  app.innerHTML = html;
  if(wire) wire();
  restoreFocus(focusInfo);
}

function loadingScreen(){
  return '' +
  '<div class="top"><div class="brand"><img src="./SPW_DeBoomIn_Huisstijl/logos/logo.jpg" class="brand-logo" alt="Logo"><h1>Kurkenemmer</h1></div></div>' +
  '<div class="card balance" style="text-align:center">' +
    '<div class="figure" style="font-size:1.8rem">Verbinden&hellip;</div>' +
    '<p class="muted">Even geduld, we halen de laatste stand op.</p>' +
  '</div>';
}

function dbErrorScreen(){
  return '' +
  '<div class="top"><div class="brand"><img src="./SPW_DeBoomIn_Huisstijl/logos/logo.jpg" class="brand-logo" alt="Logo"><h1>Kurkenemmer</h1></div></div>' +
  '<div class="card">' +
    '<h2>Geen verbinding</h2>' +
    '<p class="muted small">Kan de database niet bereiken. Controleer of firebaseConfig bovenaan index.html is ingevuld en of de Firestore-rules gepubliceerd zijn.</p>' +
    '<p class="small" style="word-break:break-all">' + esc(dbError) + '</p>' +
  '</div>' +
  '<button class="btn primary" id="retry" style="margin-top:.6rem">Opnieuw proberen</button>';
}
function wireRetry(){
  document.getElementById("retry").onclick = function(){ location.reload(); };
}

/* ---------- 0. waiting room + admin gate ---------- */
function waitingScreen(){
  return '' +
  '<div class="top"><div class="brand"><img src="./SPW_DeBoomIn_Huisstijl/logos/logo.jpg" class="brand-logo" alt="Logo"><h1>Kurkenemmer</h1></div></div>' +
  '<div class="card balance" style="text-align:center">' +
    '<div class="figure" style="font-size:1.8rem">Spel begint zo</div>' +
    '<p class="muted">Even geduld &mdash; de kurkenemmer is nog niet open.</p>' +
  '</div>' +
  '<div class="sect" style="text-align:center">' +
    '<button class="linkbtn" id="adminLink">Admin login</button>' +
  '</div>';
}
function wireWaiting(){
  document.getElementById("adminLink").onclick = function(){
    go({name:"admin-login", pw:"", back:null});
  };
}

function adminLoginScreen(){
  return '' +
  '<div class="top"><button class="linkbtn" id="back">&larr; Terug</button></div>' +
  '<h1>Admin login</h1>' +
  '<p class="muted small">Alleen voor de spelleider.</p>' +
  '<div class="card" style="margin-top:1rem">' +
    '<label for="pw">Wachtwoord</label>' +
    '<input type="text" id="pw" placeholder="placeholder" autocomplete="off">' +
  '</div>' +
  '<div class="err" id="err"></div>' +
  '<button class="btn primary" id="go" style="margin-top:.6rem">Inloggen</button>';
}
function wireAdminLogin(){
  document.getElementById("back").onclick = function(){ go(null); };
  var pw = document.getElementById("pw");
  pw.focus();
  function attempt(){
    var stillDefault = effectiveAdminPassword() === ADMIN_PASSWORD;
    if(pw.value === effectiveAdminPassword()){
      adminAuthed = true;
      go(stillDefault ? {name:"admin-set-password"} : (S ? {name:"admin-panel"} : null));
    } else {
      document.getElementById("err").textContent = "Verkeerd wachtwoord.";
    }
  }
  pw.onkeydown = function(e){ if(e.key === "Enter") attempt(); };
  document.getElementById("go").onclick = attempt;
}

function adminSetPasswordScreen(){
  return '' +
  '<div class="top"><div class="brand"><img src="./SPW_DeBoomIn_Huisstijl/logos/logo.jpg" class="brand-logo" alt="Logo"><h1>Kurkenemmer</h1></div></div>' +
  '<h1>Nieuw admin-wachtwoord</h1>' +
  '<p class="muted small">Je logt nog in met het standaardwachtwoord "placeholder". Kies er hier eentje van jezelf &mdash; dat vervangt het voortaan.</p>' +
  '<div class="card" style="margin-top:1rem">' +
    '<label for="npw">Nieuw wachtwoord</label>' +
    '<input type="text" id="npw" autocomplete="off">' +
    '<label for="npw2" style="margin-top:.6rem">Herhaal wachtwoord</label>' +
    '<input type="text" id="npw2" autocomplete="off">' +
  '</div>' +
  '<div class="err" id="err"></div>' +
  '<button class="btn primary" id="savePw" style="margin-top:.6rem">Wachtwoord instellen</button>' +
  '<button class="btn quiet" id="skipPw" style="margin-top:.5rem">Later &mdash; blijf bij placeholder</button>';
}
function wireAdminSetPassword(){
  var npw = document.getElementById("npw");
  npw.focus();
  function proceed(){ go(S ? {name:"admin-panel"} : null); }
  document.getElementById("skipPw").onclick = proceed;
  document.getElementById("savePw").onclick = function(){
    var v = npw.value.trim();
    var v2 = document.getElementById("npw2").value.trim();
    var err = document.getElementById("err");
    if(!v){ err.textContent = "Vul een wachtwoord in."; return; }
    if(v === ADMIN_PASSWORD){ err.textContent = "Kies iets anders dan \"placeholder\"."; return; }
    if(v !== v2){ err.textContent = "De wachtwoorden komen niet overeen."; return; }
    if(S){ S.adminPassword = v; save(); }
    else { pendingAdminPassword = v; }
    proceed();
  };
}

function adminPanelScreen(){
  var confirming = view.confirming;

  var extra = "";
  if(S && !confirming){
    var moveWhoOpts = everyone().map(function(p){
      var groupLabel = p.role === "banker" ? "Bankier" : p.role === "grenswacht" ? "Grenswacht" : teamNameOf(p.teamId);
      return '<option value="'+p.id+'">'+esc(p.name)+' ('+esc(groupLabel)+')</option>';
    }).join("");
    var moveToOpts = '<option value="banker">Bankier</option><option value="grenswacht">Grenswacht</option>' +
      S.teams.map(function(t){ return '<option value="'+t.id+'">'+esc(t.name)+'</option>'; }).join("");

    var pinRows = everyone().map(function(p){
      var groupLabel = p.role === "banker" ? "Bankier" : p.role === "grenswacht" ? "Grenswacht"
                      : (p.role === "leader" ? "Leider &middot; " : "") + esc(teamNameOf(p.teamId));
      return '<div class="rosterline"><span>' + esc(p.name) +
        '<br><span class="small muted">' + groupLabel + ' &middot; ' + (p.pin ? 'code ingesteld' : 'nog geen code') + '</span></span>' +
        '<button class="btn" style="width:auto;padding:.5rem .8rem" data-resetpin="' + p.id + '">Reset</button></div>';
    }).join("");

    extra = '' +
    '<div class="card sect"><h2>Iemand verplaatsen</h2>' +
      '<p class="small muted">Verplaats iemand naar een andere groep of team. Hun persoonlijke saldo blijft altijd bij hen, ' +
        'ook bij Bankier of Grenswacht &mdash; het wordt daar alleen niet getoond, en duikt weer op zodra ze in een team komen.</p>' +
      '<label for="moveWho">Persoon</label><select id="moveWho">' + moveWhoOpts + '</select>' +
      '<label for="moveTo">Naar</label><select id="moveTo">' + moveToOpts + '</select>' +
      '<div class="err" id="moveErr"></div>' +
      '<button class="btn primary" id="moveBtn" style="margin-top:.6rem">Verplaatsen</button>' +
    '</div>' +
    '<div class="card sect"><h2>Codes resetten</h2>' +
      '<p class="small muted">Wist de code van iemand zodat die bij de volgende inlog een nieuwe kiest.</p>' +

function pinScreen(){

             : view.mode === "create2" ? "Typ ze nog een keer ter bevestiging."

function wirePin(){
  document.getElementById("back").onclick = function(){ me = null; go(null); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-k]"), function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-k");
      if(k === "del"){ view.typed = view.typed.slice(0,-1); flash=""; render(); return; }
      if(view.typed.length >= 4) return;
      view.typed += k;
      if(view.typed.length < 4){ render(); return; }

      var p = findPerson(view.who).obj;

      if(view.mode === "enter"){
        if(view.typed === p.pin){ me = view.who; go(null); }
        else { flash = "Verkeerde code."; view.typed = ""; render(); }
        return;
      }
      if(view.mode === "create1"){
        view.candidate = view.typed;
        view.typed = "";
        view.mode = "create2";
        render();
        return;
      }
      if(view.mode === "create2"){
        if(view.typed === view.candidate){
          p.pin = view.typed;
          save();
          me = view.who;
          go(null);
        } else {
          flash = "Codes kwamen niet overeen. Probeer opnieuw.";
          view.typed = "";
          view.candidate = "";
          view.mode = "create1";
          render();
        }
        return;
      }
    };
  });
}

function wireMove(){
  document.getElementById("back").onclick = function(){ go(null); };
  var amtEl = document.getElementById("amt");
  amtEl.focus();
  document.getElementById("doIt").onclick = function(){
    var err = document.getElementById("err");
    var n = amountFrom(amtEl.value);
    if(n === null){ err.textContent = "Voer een heel getal groter dan nul in."; return; }
    var kind = view.kind, p = findPerson(me);
    var tEl = document.getElementById("target");
    var targetId = tEl ? tEl.value : null;

    if(kind === "fund"){
      if(myRole() !== "banker" && myRole() !== "grenswacht"){ err.textContent = "Alleen een bankier of de Grenswacht kan dit doen."; return; }
      var recip = findPerson(targetId);
      recip.obj.balance += n;
      logIt(p.obj.name + " stortte " + money(n) + " op de rekening van " + recip.obj.name, "up");
    }
    else if(kind === "take"){
      if(myRole() !== "banker" && myRole() !== "grenswacht"){ err.textContent = "Alleen een bankier of de Grenswacht kan dit doen."; return; }
      var hit = findPerson(targetId);
      if(hit.obj.balance < n){ err.textContent = hit.obj.name + " heeft maar " + money(hit.obj.balance) + "."; return; }
      hit.obj.balance -= n;
      logIt(p.obj.name + " haalde " + money(n) + " weg bij " + hit.obj.name, "down");
    }
    else if(kind === "give"){
      if(p.kind !== "member"){ err.textContent = "Bankiers hebben geen persoonlijke rekening."; return; }
      if(p.obj.balance < n){ err.textContent = "Je hebt maar " + money(p.obj.balance) + "."; return; }
      p.obj.balance -= n; p.team.bank += n;
      logIt(p.obj.name + " stortte " + money(n) + " in de kas van " + p.team.name, "up");
    }
    else if(kind === "pay"){
      if(myRole() !== "leader"){ err.textContent = "Alleen de teamleider kan dit doen."; return; }
      var mem = null; p.team.members.forEach(function(m){ if(m.id===targetId) mem = m; });
      if(!mem){ err.textContent = "Die persoon zit niet in jouw team."; return; }
      if(p.team.bank < n){ err.textContent = "De teamkas bevat maar " + money(p.team.bank) + "."; return; }
      p.team.bank -= n; mem.balance += n;
      logIt(p.obj.name + " betaalde " + mem.name + " " + money(n) + " uit de kas van " + p.team.name, "down");
    }
    else if(kind === "send"){
      if(p.kind !== "member"){ err.textContent = "Alleen leden met een persoonlijke rekening kunnen geld sturen."; return; }
      if(p.obj.balance < n){ err.textContent = "Je hebt maar " + money(p.obj.balance) + "."; return; }
      var val = tEl.value;
      if(val.indexOf("person:") === 0){
        var recip2 = findPerson(val.slice(7));
        if(!recip2 || recip2.kind !== "member"){ err.textContent = "Ontvanger niet gevonden."; return; }
        p.obj.balance -= n; recip2.obj.balance += n;
        logIt(p.obj.name + " stuurde " + money(n) + " naar " + recip2.obj.name, "down");
      } else if(val.indexOf("team:") === 0){
        var destTeam2 = teamByIdRef(val.slice(5));
        if(!destTeam2){ err.textContent = "Team niet gevonden."; return; }
        p.obj.balance -= n; destTeam2.bank += n;
        logIt(p.obj.name + " stuurde " + money(n) + " naar de kas van " + destTeam2.name, "down");
      } else if(val === "grenswacht" && S.grenswacht){
        p.obj.balance -= n; S.grenswacht.bank += n;
        logIt(p.obj.name + " stuurde " + money(n) + " naar de kas van Grenswacht", "down");
      } else {
        err.textContent = "Kies een ontvanger."; return;
      }
    }

    save();
    go(null);
  };
  amtEl.onkeydown = function(e){ if(e.key === "Enter") document.getElementById("doIt").click(); };
}

/* ---------- 5b. Grenswacht: confiscate above the threshold ---------- */
function confiscateScreen(){
  var rows = "", any = false;
  S.teams.forEach(function(t){
    t.members.forEach(function(m){
      if(m.balance > CONFISCATE_THRESHOLD){
        any = true;
        var take = m.balance - CONFISCATE_THRESHOLD;
        rows += '<div class="rosterline"><span>' + esc(m.name) + ' <span class="small muted">(' + esc(t.name) + ')</span>' +
          '<br><span class="small muted">heeft ' + money(m.balance) + ' ' + esc(unit()) + '</span></span>' +
          '<button class="btn" style="width:auto;padding:.5rem .8rem" data-take="' + m.id + '">Neem ' + money(take) + '</button></div>';
      }
    });
  });
  return '' +
  '<div class="top"><button class="linkbtn" id="back">&larr; Terug</button></div>' +
  '<h1>Kurken boven de ' + CONFISCATE_THRESHOLD + ' innemen</h1>' +
  '<p class="muted small">Het overschot boven ' + CONFISCATE_THRESHOLD + ' ' + esc(unit()) + ' gaat naar de Grenswachtkas.</p>' +
  '<div class="card" style="margin-top:1rem">' +
    (any ? rows : '<p class="muted">Niemand heeft op dit moment meer dan ' + CONFISCATE_THRESHOLD + ' ' + esc(unit()) + '.</p>') +
  '</div>';
}
function wireConfiscate(){
  document.getElementById("back").onclick = function(){ go(null); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-take]"), function(b){
    b.onclick = function(){
      var hit = findPerson(b.getAttribute("data-take"));
      if(!hit || hit.kind !== "member" || hit.obj.balance <= CONFISCATE_THRESHOLD) return;
      var take = hit.obj.balance - CONFISCATE_THRESHOLD;
      hit.obj.balance = CONFISCATE_THRESHOLD;
      S.grenswacht.bank += take;
      logIt("Grenswacht nam " + money(take) + " in bij " + hit.obj.name, "down");
      save();
      go({name:"confiscate"});
    };
  });
}

/* ---------- 6. ledger ---------- */
function ledgerScreen(){
  var rows = S.log.map(function(e){
    var d = new Date(e.t);
    return '<div class="entry ' + e.dir + '"><span class="tick"></span><span>' + esc(e.text) +
           '<time>' + d.toLocaleString() + '</time></span></div>';
  }).join("");
  return '' +
  '<div class="top"><button class="linkbtn" id="back">&larr; Terug</button></div>' +
  '<h1>Recente activiteit</h1>' +
  '<div class="card" style="margin-top:1rem">' + (rows || '<p class="muted">Er is nog niets gebeurd.</p>') + '</div>';
}

/* ---------- 7. roster (bankers only) ---------- */
function rosterScreen(){
  var blocks = '<div class="card"><h2>Bankiers</h2>' +
    S.bankers.map(function(b){
      return '<div class="rosterline"><span>' + esc(b.name) + '</span><span class="small ' +
             (b.pin ? 'muted">Code ingesteld' : 'pin">Nog geen code') + '</span></div>';
    }).join("") + '</div>';

  if(S.grenswacht){
    blocks += '<div class="card"><h2 style="display:flex;align-items:center">' + teamDot(GRENSWACHT_COLOR) + 'Grenswacht</h2>' +
      '<div class="rosterline"><span class="muted">Grenswachtkas</span><span class="amt">' + money(S.grenswacht.bank) + '</span></div>' +
      S.grenswacht.members.map(function(m){
        return '<div class="rosterline"><span>' + esc(m.name) + '</span><span class="small ' +
               (m.pin ? 'muted">Code ingesteld' : 'pin">Nog geen code') + '</span></div>';
      }).join("") + '</div>';
  }

  S.teams.forEach(function(t){
    blocks += '<div class="card"><h2 style="display:flex;align-items:center">' + teamDot(t.color) + esc(t.name) + '</h2>' +
      '<div class="rosterline"><span class="muted">Teamkas</span><span class="amt">' + money(t.bank) + '</span></div>' +
      t.members.map(function(m){
        return '<div class="rosterline"><span>' + esc(m.name) + (m.leader ? ' <span class="small muted">leider</span>' : '') +
               '<br><span class="small muted">' + money(m.balance) + ' ' + esc(unit()) + '</span></span>' +
               '<span class="small ' + (m.pin ? 'muted">Code ingesteld' : 'pin">Nog geen code') + '</span></div>';
      }).join("") + '</div>';
  });

  return '' +
  '<div class="top"><button class="linkbtn" id="back">&larr; Terug</button></div>' +
  '<h1>Overzicht</h1><p class="muted small">Codes zijn privé &mdash; iedereen stelt de eigen code in bij de eerste keer inloggen.</p>' +
  '<div class="stack sect">' + blocks + '</div>';
}

function wireBack(){
  document.getElementById("back").onclick = function(){ go(null); };
}

gameDocRef.onSnapshot(function(snap){
  dbError = null;
  S = snap.exists ? snap.data() : null;
  normalizeState();
  render();
}, function(err){
  dbError = (err && err.message) ? err.message : String(err);
  render();
});

render();
</script>
</body>
</html>
